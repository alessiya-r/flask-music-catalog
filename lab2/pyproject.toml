
# Файл описания проекта 

# Система сборки 
# Указывает, каким инструментом собирать проект в пакет .whl
# ------------------------------------------------------------
[build-system]
# Инструменты, которые нужны ДЛЯ СБОРКИ (не для работы приложения).
# setuptools - стандартный сборщик Python-пакетов
requires = ["setuptools>=68"]
# Какой именно модуль setuptools выполняет сборку
build-backend = "setuptools.build_meta"


# Информация о проекте 
# ------------------------------------------------------------
[project]
# Название пакета 
name = "webapp"
# Версия проекта. Попадёт в имя файла .whl
version = "0.1.0"
# Краткое описание
description = "Лабораторная работа №2: веб-приложение на Flask"

# Минимальная версия Python, на которой работает проект
requires-python = ">=3.11"
authors = [{ name = "Alessiya" }]



# Зависимости 
# Библиотеки, которые нужны приложению для работы.
# pip установит их автоматически вместе с пакетом
# ------------------------------------------------------------
dependencies = [
    # Flask - веб-фреймворк. Вместе с ним установятся
    # его зависимости: Werkzeug, Jinja2, click и другие
    "flask>=3.1",
]

# Настройки setuptools 
# ------------------------------------------------------------
[tool.setuptools.packages.find]
# Искать пакеты с кодом в папке src
where = ["src"]


# Какие файлы, кроме кода, положить в архив:
# HTML-страницы из папки templates
[tool.setuptools.package-data]
webapp = ["templates/*.html"]

