<html>
<head>
    <meta charset="utf-8">
    <title>{{ m.catalog }}</title>
</head>
<body>
    <h2>{{ m.catalog }}</h2>

    <p>{{ m.language }}: <a href="/?lang=ru">RU</a> | <a href="/?lang=en">EN</a></p>

    <form action="/SongsList" method="get">
        <input type="hidden" name="lang" value="{{ lang }}">
        {{ m.genre }}:
        <select name="genre">
            <option value="">{{ m.all }}</option>
            <option value="rock">{{ m.genres['rock'] }}</option>
            <option value="pop">{{ m.genres['pop'] }}</option>
            <option value="jazz">{{ m.genres['jazz'] }}</option>
        </select>
        <button type="submit">{{ m.show }}</button>
    </form>
</body>
</html>
