<html>
<head>
    <meta charset="utf-8">
    <title>{{ m.catalog }}</title>
</head>
<body>
    <h2>{{ m.catalog }}</h2>

    <p>{{ m.language }}:
        <a href="/SongsList?genre={{ genre }}&amp;lang=ru">RU</a> |
        <a href="/SongsList?genre={{ genre }}&amp;lang=en">EN</a>
    </p>

        <p>{{ m.selected_genre }}: {{ m.genres[genre] if genre else m.all }}</p>

    <table border="1" cellpadding="5">
        <tr>
            <th>{{ m.title }}</th>
            <th>{{ m.artist }}</th>
            <th>{{ m.genre }}</th>
            <th>{{ m.year }}</th>
        </tr>
        {% for song in songs %}
        <tr>
            <td>{{ song.title }}</td>
            <td>{{ song.artist }}</td>
            <td>{{ m.genres[song.genre] }}</td>
            <td>{{ song.year }}</td>
        </tr>
        {% endfor %}
    </table>

    <p><a href="/?lang={{ lang }}">{{ m.home }}</a></p>
</body>
</html>
