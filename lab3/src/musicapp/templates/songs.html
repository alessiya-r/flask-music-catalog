<html>
<head>
    <meta charset="utf-8">
    <title>{{ catalog_name }}</title>
</head>
<body>
    <h2>{{ catalog_name }}</h2>
    <p>Выбранный жанр: {{ genre if genre else "все" }}</p>

    <table border="1" cellpadding="5">
        <tr>
            <th>Название</th>
            <th>Исполнитель</th>
            <th>Жанр</th>
            <th>Год</th>
        </tr>
        {% for song in songs %}
        <tr>
            <td>{{ song.title }}</td>
            <td>{{ song.artist }}</td>
            <td>{{ song.genre }}</td>
            <td>{{ song.year }}</td>
        </tr>
        {% endfor %}
    </table>

    <p><a href="/">На главную</a></p>
</body>
</html>
